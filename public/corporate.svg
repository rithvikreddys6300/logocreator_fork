    <rect x="48" y="28" width="4" height="4" rx="0.5"/>
    <rect x="54" y="28" width="4" height="4" rx="0.5"/>
    
    <rect x="36" y="36" width="4" height="4" rx="0.5"/>
    <rect x="42" y="36" width="4" height="4" rx="0.5"/>
    <rect x="48" y="36" width="4" height="4" rx="0.5"/>
    <rect x="54" y="36" width="4" height="4" rx="0.5"/>
    
    <rect x="36" y="44" width="4" height="4" rx="0.5"/>
    <rect x="42" y="44" width="4" height="4" rx="0.5"/>
    <rect x="48" y="44" width="4" height="4" rx="0.5"/>
    <rect x="54" y="44" width="4" height="4" rx="0.5"/>
    
    <rect x="36" y="52" width="4" height="4" rx="0.5"/>
