    <rect x="48" y="60" width="4" height="4" rx="0.5"/>
    <rect x="54" y="60" width="4" height="4" rx="0.5"/>
  </g>
  
  <!-- Side buildings for depth -->
  <rect x="20" y="36" width="12" height="40" fill="#34495e" rx="1"/>
  <rect x="64" y="30" width="12" height="46" fill="#34495e" rx="1"/>
  
  <!-- Side building windows -->
  <g fill="#ffffff" opacity="0.8">
    <!-- Left building -->
    <rect x="22" y="40" width="2" height="2" rx="0.25"/>
    <rect x="26" y="40" width="2" height="2" rx="0.25"/>
    <rect x="22" y="46" width="2" height="2" rx="0.25"/>
    <rect x="26" y="46" width="2" height="2" rx="0.25"/>
    <rect x="22" y="52" width="2" height="2" rx="0.25"/>
    <rect x="26" y="52" width="2" height="2" rx="0.25"/>
    <rect x="22" y="58" width="2" height="2" rx="0.25"/>
    <rect x="26" y="58" width="2" height="2" rx="0.25"/>
    
