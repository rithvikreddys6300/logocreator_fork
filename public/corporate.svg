    <rect x="66" y="34" width="2" height="2" rx="0.25"/>
    <rect x="70" y="34" width="2" height="2" rx="0.25"/>
    <rect x="66" y="40" width="2" height="2" rx="0.25"/>
    <rect x="70" y="40" width="2" height="2" rx="0.25"/>
    <rect x="66" y="46" width="2" height="2" rx="0.25"/>
    <rect x="70" y="46" width="2" height="2" rx="0.25"/>
